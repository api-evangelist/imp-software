aid: imp-software
name: IMP Software
description: 'IMP Software builds MAT-first financial management software for the UK education
  sector. Its flagship product, IMP Planner, is a single-database, trust-wide platform for
  budgeting, forecasting, reporting, Integrated Curriculum Financial Planning (ICFP) and
  purchasing, used by Multi-Academy Trusts (MATs) and their schools. Based in Exeter, UK,
  the company is trusted by more than 550 trusts across roughly 6,000 schools and secured
  a growth investment from Partech in September 2025. IMP Planner is a closed SaaS application
  for trust finance teams; IMP Software does not publish a public developer API.'
